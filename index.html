<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой сайт</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #f4f4f4;
    color: #222;
    line-height: 1.6;
    padding: 2rem;
  }
  header {
    background: #2c3e50;
    color: #fff;
    padding: 1.5rem;
    border-radius: 8px;
    text-align: center;
  }
  main {
    max-width: 640px;
    margin: 2rem auto;
  }
  section {
    background: #fff;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  h2 { margin-bottom: .5rem; color: #2c3e50; }
  a { color: #3498db; text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer {
    text-align: center;
    color: #888;
    font-size: .9rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Мой сайт</h1>
    <p>Немного стиля, но всё ещё легко</p>
  </header>

  <main>
    <section>
      <h2>О сайте</h2>
      <p>Это одностраничник с CSS, без JavaScript и внешних файлов.</p>
    </section>

    <section>
      <h2>Ссылки</h2>
      <p>Например, <a href="https://example.com">example.com</a>.</p>
    </section>
  </main>

  <footer>© 2026 Мой сайт</footer>
</body>
</html>
